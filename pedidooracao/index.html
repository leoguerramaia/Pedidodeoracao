    const DEFAULT_SUPABASE_URL = "https://muocgmrzqmzlqsfcwwjv.supabase.co";
    const DEFAULT_SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11b2NnbXJ6cW16bHFzZmN3d2p2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MzcyODYsImV4cCI6MjEwODIxMzI4Nn0.djInm38kjqWnKsqkYUXJUJ5fcXflyGG6HNDI8luIVYc";

    const CATEGORIAS_PEDIDO = [
      { id: "Saúde", label: "Saúde", icon: "🌿", badgeClass: "bg-[#EBF0EC] text-[#287A58] border-[#CFE0D5]" },
      { id: "Família", label: "Família", icon: "🏡", badgeClass: "bg-[#F5EFE2] text-[#8C6D32] border-[#E6D8BC]" },
      { id: "Trabalho", label: "Trabalho", icon: "💼", badgeClass: "bg-[#EBF0F7] text-[#172B4D] border-[#CFDCEB]" },
      { id: "Vida espiritual", label: "Vida espiritual", icon: "🕊️", badgeClass: "bg-[#F0EEF8] text-[#3B3469] border-[#DCD7EE]" },
      { id: "Gratidão", label: "Gratidão", icon: "✨", badgeClass: "bg-[#FDF6E7] text-[#8A621C] border-[#ECD9B0]" },
      { id: "Outros", label: "Outros", icon: "🙏", badgeClass: "bg-[#F3EFE6] text-[#28313D] border-[#E8E5DE]" }
    ];

    function safeGetStorage(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {}
    }

    function normalizeSupabaseRestUrl(rawUrl) {
      let clean = String(rawUrl || DEFAULT_SUPABASE_URL).trim();
      if (!clean) clean = DEFAULT_SUPABASE_URL;
      clean = clean.replace(/\/+$/, "");
      if (clean.endsWith("/rest/v1")) {
        return clean;
      }
      return clean + "/rest/v1";
    }

    // =========================================================================
    // 2. ESTADO GLOBAL E COMPATIBILIDADE RESILIENTE DE COLUNAS SUPABASE
    // =========================================================================
    const MESES_NOMES = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    const DEFAULT_AVATAR = "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
        <rect width="120" height="120" rx="60" fill="#EBF0EC"/>
        <circle cx="60" cy="46" r="22" fill="#172B4D"/>
        <path d="M24 102C24 82.1177 40.1177 66 60 66C79.8823 66 96 82.1177 96 102" fill="#172B4D"/>
      </svg>`
    );

    function createInitialAdmin() {
      return {
        id: "usr_admin",
        username: "admin",
        nome: "Administrador",
        sobrenome: "Master",
        sexo: "Masculino",

        senha: "admin",

        precisa_trocar_senha: true,
        reset_solicitado: false,

      };
    }

    function inferCategoriaFromTexto(texto) {
      const t = String(texto || "").toLowerCase();
      if (t.includes("saúde") || t.includes("saude") || t.includes("cura") || t.includes("médic") || t.includes("cirurgia") || t.includes("hospital")) return "Saúde";
      if (t.includes("família") || t.includes("familia") || t.includes("filh") || t.includes("casamento") || t.includes("espos") || t.includes("lar")) return "Família";
      if (t.includes("emprego") || t.includes("trabalho") || t.includes("porta") || t.includes("financeir") || t.includes("profission")) return "Trabalho";
      if (t.includes("gratidão") || t.includes("gratidao") || t.includes("agradeç") || t.includes("agradec") || t.includes("bênção") || t.includes("milagre")) return "Gratidão";
      if (t.includes("fé") || t.includes("espiritual") || t.includes("paz") || t.includes("sabedoria") || t.includes("caminhada")) return "Vida espiritual";
      return "Vida espiritual";
    }

    // Codifica e decodifica metadados do pedido dentro da coluna `pedido` de forma 100% invisível e compatível com Supabase
    function encodePedidoTextWithMeta(pedidoObj) {
      const cleanText = String(pedidoObj.texto || "").replace(/^\[META:[^\]]+\]\n?/i, "").trim();
      const cat = pedidoObj.categoria || inferCategoriaFromTexto(cleanText);
      const anon = pedidoObj.anonimo ? "1" : "0";
      const priv = pedidoObj.privacidade === "reservado" ? "reservado" : "publico";
      const orando = Math.max(0, parseInt(pedidoObj.oracoes_count || 0, 10) || 0);
      return `[META:cat=${cat}|anon=${anon}|priv=${priv}|orando=${orando}]\n${cleanText}`;
    }

    function parsePedidoTextAndMeta(rawText) {
      const str = String(rawText || "");
      const m = str.match(/^\[META:([^\]]+)\]\n?([\s\S]*)$/i);
      if (!m) {
        const clean = str.trim();
        return {
          texto: clean,
          categoria: inferCategoriaFromTexto(clean),
          anonimo: false,
          privacidade: "publico",
          oracoes_count: 0
        };
      }
      const metaPart = m[1];
      const bodyText = (m[2] || "").trim();
      const kv = {};
      metaPart.split("|").forEach(pair => {
        const idx = pair.indexOf("=");
        if (idx > 0) {
          kv[pair.slice(0, idx).trim()] = pair.slice(idx + 1).trim();
        }
      });
      return {
        texto: bodyText,
        categoria: kv.cat || inferCategoriaFromTexto(bodyText),
        anonimo: kv.anon === "1",
        privacidade: kv.priv === "reservado" ? "reservado" : "publico",
        oracoes_count: Math.max(0, parseInt(kv.orando || "0", 10) || 0)
      };
    }

    function normalizeUserFromDb(raw) {
      if (!raw || typeof raw !== "object") return createInitialAdmin();
      let comp = raw.complemento || "";
      let bday = raw.data_nascimento || "";
      if (!bday && comp.includes("[NASC:")) {
        const m = comp.match(/\[NASC:([0-9]{4}-[0-9]{2}-[0-9]{2})\]/);
        if (m) bday = m[1];
      }
      comp = comp.replace(/\s*\[NASC:[0-9]{4}-[0-9]{2}-[0-9]{2}\]/g, "").trim();

      const isMasterUser =
        raw.id === "usr_admin" ||
        raw.id === "admin_master" ||
        String(raw.username || "").toLowerCase() === "admin" ||
        String(raw.email || "").toLowerCase() === "admin@oracao.org";

      const isAdminFlag = Boolean(
        isMasterUser ||
        raw.is_admin === true ||
        raw.role === "admin" ||
        raw.role === "master"
      );

      return {
        id: isMasterUser ? "usr_admin" : String(raw.id || "usr_" + Date.now()),
        username: isMasterUser ? "admin" : String(raw.username || raw.email || ""),
        nome: raw.nome || "",
        sobrenome: raw.sobrenome || "",
        sexo: raw.sexo || "Masculino",
        data_nascimento: bday,
        telefone: raw.telefone || "",
        email: raw.email || "",
        cep: raw.cep || "",
        rua: raw.rua || "",
        numero: raw.numero || "",
        complemento: comp,
        bairro: raw.bairro || "",
        cidade: raw.cidade || "",
        estado: raw.estado || "",
        senha: String(raw.senha || "1234"),
        foto: raw.foto_perfil || raw.foto || DEFAULT_AVATAR,
        role: isMasterUser ? "master" : (isAdminFlag ? "admin" : "user"),
        is_admin: isAdminFlag,
        precisa_trocar_senha: Boolean(
          raw.must_change_password !== undefined ? raw.must_change_password : raw.precisa_trocar_senha
        ),
        reset_solicitado: Boolean(
          raw.reset_requested !== undefined ? raw.reset_requested : raw.reset_solicitado
        ),
        criado_em: raw.created_at || raw.criado_em || new Date().toISOString()
      };
    }

    function normalizePedidoFromDb(raw) {
      if (!raw || typeof raw !== "object") return null;
      const rawContent = raw.pedido !== undefined ? raw.pedido : (raw.texto || "");
      const parsed = parsePedidoTextAndMeta(rawContent);
      const isAnonName = String(raw.nome || "").toLowerCase() === "anônimo" || String(raw.nome || "").toLowerCase() === "anonimo";

      return {
        id: String(raw.id || "ped_" + Date.now()),
        user_id: String(raw.user_id || "convidado"),
        nome: raw.nome || "Anônimo",
        sobrenome: raw.sobrenome || "",
        sexo: raw.sexo || "Masculino",
        texto: parsed.texto,
        categoria: raw.categoria || parsed.categoria || "Vida espiritual",
        anonimo: Boolean(raw.anonimo !== undefined ? raw.anonimo : (parsed.anonimo || isAnonName)),
        privacidade: raw.privacidade || parsed.privacidade || "publico",
        oracoes_count: Math.max(
          Number(raw.oracoes_count || 0),
          Number(parsed.oracoes_count || 0)
        ),
        criado_em: raw.created_at || raw.criado_em || new Date().toISOString()
      };
    }

    const state = {
      route: "home",
      mobileMenuOpen: false,
      currentUser: safeGetStorage("po_current_user", null),
      usuarios: (safeGetStorage("po_usuarios_v3", [createInitialAdmin()]) || []).map(normalizeUserFromDb),

      expandedPrayerIds: {},
      muralPageSize: 6,
      sbUrl: safeGetStorage("po_sb_url", DEFAULT_SUPABASE_URL),

      prayerFormState: {

        anonimo: false,

        categoria: "Todas",
        busca: ""

    function getEl(id) {
      const all = document.querySelectorAll(`[id="${id}"]`);

    // =========================================================================
    // 3. CÁLCULO DE DATA DE NASCIMENTO E IDADE DO ANIVERSARIANTE
    // =========================================================================
    function parseBirthDate(dateStr) {
      if (!dateStr || typeof dateStr !== "string") return null;
      const clean = dateStr.trim();
      let m = clean.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) {
        return {
          year: parseInt(m[1], 10),
          month: parseInt(m[2], 10),
          day: parseInt(m[3], 10),
          iso: `${m[1]}-${m[2]}-${m[3]}`
        };
      }
      m = clean.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) {
        return {
          year: parseInt(m[3], 10),
          month: parseInt(m[2], 10),
          day: parseInt(m[1], 10),
          iso: `${m[3]}-${m[2]}-${m[1]}`
        };
      }
      return null;
    }

    function getBirthdayInfo(dateStr) {
      const parsed = parseBirthDate(dateStr);
      if (!parsed || !parsed.year || parsed.year < 1900 || parsed.year > new Date().getFullYear()) {
        return null;
      }
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();

      const idadeFazendo = Math.max(0, currentYear - parsed.year);
      const isToday = (parsed.month === currentMonth && parsed.day === currentDay);

      const dayPad = String(parsed.day).padStart(2, "0");
      const monthPad = String(parsed.month).padStart(2, "0");

      return {
        ...parsed,
        idadeFazendo,
        isToday,
        shortDate: `${dayPad}/${monthPad}`,
        fullDateFormatted: `${dayPad}/${monthPad}/${parsed.year}`,
        extensoDate: `${dayPad} de ${MESES_NOMES[parsed.month - 1]}`,
        badgeTexto: isToday
          ? `🎉 Hoje! Fazendo ${idadeFazendo} anos`
          : `🎂 Fazendo ${idadeFazendo} anos`
      };
    }

    function getAniversariantesPorMes(mesFiltro) {
      const targetMonth = Number(mesFiltro);
      return state.usuarios
        .map(u => {
          const info = getBirthdayInfo(u.data_nascimento);
          return info ? { user: u, bday: info } : null;
        })
        .filter(item => {
          if (!item) return false;
          if (targetMonth === 0) return true;
          return item.bday.month === targetMonth;
        })
        .sort((a, b) => {
          if (a.bday.month !== b.bday.month) return a.bday.month - b.bday.month;
          return a.bday.day - b.bday.day;
        });
    }

    // =========================================================================
    // 4. INTEGRAÇÃO SUPABASE (COMPATÍVEL COM ESQUEMA EXISTENTE + AUTO-RETRY)
    // =========================================================================
    async function sbFetch(tableAndQuery, options = {}) {
      const restBase = normalizeSupabaseRestUrl(state.sbUrl);
      const key = String(state.sbKey || DEFAULT_SUPABASE_KEY).trim();
      const url = `${restBase}/${tableAndQuery.replace(/^\/+/, "")}`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6500);

      try {
        const headers = Object.assign({
          "apikey": key,
          "Authorization": `Bearer ${key}`,
          "Content-Type": "application/json"
        }, options.headers || {});

        const response = await fetch(url, Object.assign({}, options, {
          headers,
          signal: controller.signal
        }));
        clearTimeout(timer);

        if (!response.ok) {
          let errText = "";
          try { errText = await response.text(); } catch (e) {}
          throw new Error(`HTTP ${response.status}: ${errText}`);
        }
        const text = await response.text();
        return text ? JSON.parse(text) : null;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function buildUserPayloadForSupabase(u, includeDataNascimentoCol = true) {
      let comp = String(u.complemento || "").replace(/\s*\[NASC:[0-9]{4}-[0-9]{2}-[0-9]{2}\]/g, "").trim();
      if (!includeDataNascimentoCol && u.data_nascimento) {
        comp = (comp + ` [NASC:${u.data_nascimento}]`).trim();
      }
      const payload = {
        id: String(u.id),
        username: u.username || (u.email ? u.email.split("@")[0] : "usuario"),
        nome: u.nome || "",
        sobrenome: u.sobrenome || "",
        sexo: u.sexo || "Masculino",
        telefone: u.telefone || "",
        email: (u.email || "").toLowerCase(),
        cep: u.cep || "",
        rua: u.rua || "",
        bairro: u.bairro || "",
        cidade: u.cidade || "",
        estado: u.estado || "",
        numero: u.numero || "",
        complemento: comp,
        foto_perfil: u.foto || DEFAULT_AVATAR,
        senha: String(u.senha || "1234"),
        is_admin: isAdmin(u),
        must_change_password: Boolean(u.precisa_trocar_senha),
        reset_requested: Boolean(u.reset_solicitado),
        created_at: u.criado_em || new Date().toISOString()
      };
      if (includeDataNascimentoCol && u.data_nascimento) {
        payload.data_nascimento = u.data_nascimento;
      }
      return payload;
    }

    async function sbUpsertResilient(tableName, payloadObj) {
      let currentPayload = Object.assign({}, payloadObj);
      for (let attempt = 0; attempt < 5; attempt++) {
        try {
          await sbFetch(`${tableName}?on_conflict=id`, {
            method: "POST",
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(currentPayload)
          });
          return true;
        } catch (err) {
          const msg = String(err.message || "");
          const colMatch = msg.match(/Could not find the '([^']+)' column/i);
          if (colMatch && colMatch[1] && colMatch[1] in currentPayload) {
            const missingCol = colMatch[1];
            if (missingCol === "data_nascimento" && currentPayload.data_nascimento) {
              const bday = currentPayload.data_nascimento;
              let comp = String(currentPayload.complemento || "").replace(/\s*\[NASC:[0-9]{4}-[0-9]{2}-[0-9]{2}\]/g, "").trim();
              currentPayload.complemento = (comp + ` [NASC:${bday}]`).trim();
            }
            delete currentPayload[missingCol];
            continue;
          }
          throw err;
        }
      }
      return false;
    }

    async function syncFromSupabase(silent = true) {
      state.sbStatus = "syncing";
      if (isAdmin(state.currentUser)) renderHeader();

      try {
        const [remUsers, remPedidos] = await Promise.all([
          sbFetch("usuarios?select=*"),
          fetchPedidosFromSupabase()
        ]);

        if (Array.isArray(remUsers)) {
          if (remUsers.length === 0) {
            const master = state.usuarios.find(isMaster) || createInitialAdmin();
            await upsertUserSupabase(master);
          } else {
            const mapById = new Map();
            state.usuarios.forEach(u => {
              const nu = normalizeUserFromDb(u);
              mapById.set(nu.id, nu);
            });
            remUsers.forEach(ru => {
              const nru = normalizeUserFromDb(ru);
              const localU = mapById.get(nru.id);
              if (localU && localU.data_nascimento && !nru.data_nascimento) {
                nru.data_nascimento = localU.data_nascimento;
              }
              mapById.set(nru.id, Object.assign({}, localU || {}, nru));
            });
            state.usuarios = Array.from(mapById.values());
            ensureMasterIntegrity();
            safeSetStorage("po_usuarios_v3", state.usuarios);
          }
        }

        if (Array.isArray(remPedidos)) {
          const mapPed = new Map();
          state.pedidos.forEach(p => {
            const np = normalizePedidoFromDb(p);
            if (np) mapPed.set(np.id, np);
          });
          remPedidos.forEach(rp => {
            const nrp = normalizePedidoFromDb(rp);
            if (nrp) {
              const existing = mapPed.get(nrp.id);
              if (existing && existing.oracoes_count > nrp.oracoes_count) {
                nrp.oracoes_count = existing.oracoes_count;
              }
              mapPed.set(nrp.id, nrp);
            }
          });
          state.pedidos = Array.from(mapPed.values()).sort(
            (a, b) => new Date(b.criado_em) - new Date(a.criado_em)
          );
          safeSetStorage("po_pedidos_v3", state.pedidos);
        }

        state.sbStatus = "connected";
        state.sbLastError = "";
        if (!silent) showToast("Sincronizado com o Supabase com sucesso!", "success");
      } catch (err) {
        state.sbStatus = "offline";
        state.sbLastError = err.message || "Falha ao conectar no Supabase";
        if (!silent) showToast("Modo offline ativo: dados preservados localmente.", "warning");
      }

      renderApp();
    }

    // =========================================================================
    // 5. SISTEMA DE ROTAS (SPA + MULTI-PÁGINAS GITHUB PAGES)
    // =========================================================================
    const VALID_ROUTES = [
      "home", "login", "cadastro", "pedidoconvidado",
      "dashboard", "contatos", "pedidooracao", "acompanharpedidos",
      "aniversariantes", "perfil"
    ];

    // Nota: 'acompanharpedidos' (Mural de Oração) é público para visualização e intercessão,
    // preservando privacidade para pedidos marcados como 'reservado'.
    const PROTECTED_ROUTES = [
      "dashboard", "contatos", "pedidooracao",
      "aniversariantes", "perfil"
    ];

    function detectInitialRoute() {
      const hash = (window.location.hash || "").replace(/^#\/?/, "").trim().toLowerCase();
      if (VALID_ROUTES.includes(hash)) return hash;

      const params = new URLSearchParams(window.location.search || "");
      const qRoute = (params.get("p") || params.get("route") || "").toLowerCase();
      if (VALID_ROUTES.includes(qRoute)) return qRoute;

      const path = (window.location.pathname || "").toLowerCase().replace(/\/index\.html$/, "").replace(/\/+$/, "");
      const lastSeg = path.split("/").filter(Boolean).pop() || "";
      if (VALID_ROUTES.includes(lastSeg)) return lastSeg;

      const embedded = (window.__INITIAL_ROUTE__ || "").toLowerCase();
      if (VALID_ROUTES.includes(embedded) && embedded !== "home") return embedded;

      return state.currentUser ? "dashboard" : "home";
    }

    window.navigateTo = function(targetRoute, anchorId = "") {
      state.mobileMenuOpen = false;
      let next = String(targetRoute || "home").toLowerCase().trim();
      if (!VALID_ROUTES.includes(next)) next = "home";

      if (PROTECTED_ROUTES.includes(next) && !state.currentUser) {
        showToast("Faça login para acessar esta área exclusiva de membros.", "warning");
        next = "login";
      }

      if (state.currentUser && state.currentUser.precisa_trocar_senha && next !== "home" && next !== "login") {
        state.route = next;
        renderApp();
        openForcePasswordChangeModal();
        return;
      }

      state.route = next;
      state.prayerFormState.status = "idle";
      state.prayerFormState.message = "";

      try {
        const isGitHubHost = window.location.hostname.includes("github.io");
        if (isGitHubHost) {
          const newUrl = next === "home" || next === "dashboard"
            ? `${GITHUB_BASE_PATH}/`
            : `${GITHUB_BASE_PATH}/${next}`;
          window.history.pushState({ route: next }, "", newUrl);
        } else {
          window.location.hash = next === "home" ? "" : `#/${next}`;
        }
      } catch (e) {}

      renderApp();

      if (anchorId) {
        setTimeout(() => {
          const targetEl = document.getElementById(anchorId);
          if (targetEl) {
            targetEl.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        }, 60);
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    };

    window.scrollToSection = function(sectionId) {

      if (state.route !== "home") {

        .replace(/&/g, "&amp;")

    function formatDateTimeBR(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const dia = String(d.getDate()).padStart(2, "0");
      const mes = String(d.getMonth() + 1).padStart(2, "0");
      const ano = d.getFullYear();
      const hora = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${dia}/${mes}/${ano} às ${hora}:${min}`;
    }

    window.maskPhone = function(input) {
      let v = input.value.replace(/\D/g, "").slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0,2)}) ${v.slice(2, v.length - 4)}-${v.slice(-4)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0,2)}) ${v.slice(2)}`;
      }
      input.value = v;
    };

    window.maskCepAndLookup = async function(input, prefix) {
      let digits = input.value.replace(/\D/g, "").slice(0, 8);
      input.value = digits.length > 5 ? `${digits.slice(0,5)}-${digits.slice(5)}` : digits;
      if (digits.length === 8) {
        const statusEl = getEl(`${prefix}-cep-status`);
        if (statusEl) statusEl.textContent = "Buscando CEP...";
        try {
          const resp = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
          const data = await resp.json();
          if (!data.erro) {
            const ruaEl = getEl(`${prefix}-rua`);
            const bairroEl = getEl(`${prefix}-bairro`);
            const cidadeEl = getEl(`${prefix}-cidade`);
            const estadoEl = getEl(`${prefix}-estado`);
            if (ruaEl) ruaEl.value = data.logradouro || "";
            if (bairroEl) bairroEl.value = data.bairro || "";
            if (cidadeEl) cidadeEl.value = data.localidade || "";
            if (estadoEl) estadoEl.value = data.uf || "";
            if (statusEl) statusEl.textContent = "Endereço localizado!";
            const numEl = getEl(`${prefix}-numero`);
            if (numEl) numEl.focus();
          } else {
            if (statusEl) statusEl.textContent = "CEP não encontrado. Preencha manualmente.";

          if (statusEl) statusEl.textContent = "Preencha o endereço nos campos abaixo.";

    window.handlePhotoInput = function(fileInput, targetPreviewId, stateKey) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX = 260;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          } else {
            if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
          state[stateKey] = dataUrl;
          const prev = getEl(targetPreviewId);
          if (prev) prev.src = dataUrl;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

    // =========================================================================
    // 7. CABEÇALHO E RODAPÉ (DESIGN SYSTEM EDITORIAL CRISTÃO + MENU ACESSÍVEL)

    function renderHeader() {
      const header = document.getElementById("app-header");
      if (!header) return;

      const u = state.currentUser;
      const userIsAdmin = isAdmin(u);
      const pendingResets = userIsAdmin
        ? state.usuarios.filter(x => x.reset_solicitado).length

    window.togglePrayerAnonimo = function(checked) {
      state.prayerFormState.anonimo = Boolean(checked);
      const guestNome = getEl("guest-nome");
      const guestSob = getEl("guest-sobrenome");
      const loggedPed = getEl("logged-pedido-texto");
      const guestPed = getEl("guest-texto");
      const savedText = (loggedPed?.value || guestPed?.value || "");
      const savedNome = guestNome?.value || "";
      const savedSob = guestSob?.value || "";
      renderApp();
      const newPed = getEl("logged-pedido-texto") || getEl("guest-texto");
      if (newPed) {
        newPed.value = savedText;
        updatePrayerCharCount(newPed);
      }
      if (getEl("guest-nome") && savedNome) getEl("guest-nome").value = savedNome;
      if (getEl("guest-sobrenome") && savedSob) getEl("guest-sobrenome").value = savedSob;
    };

    window.updatePrayerCharCount = function(textarea) {
      if (!textarea) return;
      const len = (textarea.value || "").length;
      const counter = document.getElementById("prayer-char-counter");
      if (counter) {
        counter.textContent = `${len} / 1000 caracteres`;
      }
    };

    window.resetPrayerFormBanner = function() {
      state.prayerFormState.status = "idle";
      state.prayerFormState.message = "";
      renderApp();
    };

    function renderPrayerCardEditorial(p) {
      const u = state.currentUser;
      const currIsAdmin = isAdmin(u);
      const canEditOrDelete = currIsAdmin || (u && p.user_id === u.id);
      const catMeta = getCategoriaMeta(p.categoria);
      const isPrayed = Boolean(state.prayedIds[p.id]);
      const count = Math.max(0, Number(p.oracoes_count || 0));
      const isExpanded = Boolean(state.expandedPrayerIds[p.id]);
      const fullText = String(p.texto || "");
      const isLongText = fullText.length > 220;
      const displayText = (!isLongText || isExpanded)
        ? fullText
        : fullText.slice(0, 220).trim() + "…";

      const displayAuthor = p.anonimo || String(p.nome).toLowerCase() === "anônimo"
        ? "Anônimo"
        : `${p.nome} ${p.sobrenome || ""}`.trim();

      return `
        <article class="surface-card surface-card-interactive p-6 sm:p-7 flex flex-col justify-between gap-5">
          <div class="space-y-4">
            <!-- Topo do Cartão: Categoria + Data -->

              <div class="flex items-center gap-2 flex-wrap">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border ${catMeta.badgeClass}">
                  <span>${catMeta.icon}</span>
                  <span>${esc(catMeta.label)}</span>
                </span>
                ${p.privacidade === "reservado" ? `
                  <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#172B4D]/10 text-[#172B4D]">
                    🛡️ Reservado
                  </span>
                ` : ""}
              </div>
              <time class="text-xs text-[#687386] font-medium" datetime="${esc(p.criado_em)}">
                ${esc(formatDateTimeBR(p.criado_em))}
              </time>
            </div>

            <!-- Identificação do Autor -->
            <div class="flex items-center gap-2.5">
              <div class="w-9 h-9 rounded-full bg-[#F3EFE6] border border-[#E8E5DE] text-[#172B4D] flex items-center justify-center font-serif font-bold text-sm flex-shrink-0">
                ${p.anonimo ? "🕊️" : esc((displayAuthor[0] || "I").toUpperCase())}
              </div>
              <div>
                <h3 class="font-semibold text-sm text-[#28313D] leading-snug">${esc(displayAuthor)}</h3>
                <span class="text-xs text-[#687386]">${p.anonimo ? "Intenção anônima" : `Irmão(ã) da comunidade • ${esc(p.sexo || "Membro")}`}</span>
              </div>
            </div>

            <!-- Texto do Pedido com suporte a expansão -->
            <div class="space-y-2">
              <p class="text-[15px] sm:text-base text-[#28313D] whitespace-pre-line leading-relaxed">
                “${esc(displayText)}”
              </p>
              ${isLongText ? `
                <button type="button" onclick="toggleExpandPrayerText('${esc(p.id)}')"
                  class="text-xs font-semibold text-[#172B4D] hover:underline">
                  ${isExpanded ? "Mostrar menos ↑" : "Ler pedido completo ↓"}
                </button>
              ` : ""}
            </div>
          </div>

          <!-- Rodapé do Cartão: Botão de Intercessão + Ações -->
          <div class="pt-4 border-t border-[#E8E5DE] flex flex-wrap items-center justify-between gap-3">
            <button type="button"
              onclick="handlePrayForRequest('${esc(p.id)}')"
              aria-pressed="${isPrayed ? 'true' : 'false'}"
              class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition ${
                isPrayed
                  ? 'bg-[#EBF0EC] text-[#287A58] border-[#829889] cursor-default'
                  : 'bg-[#FAF8F3] hover:bg-[#F3EFE6] text-[#172B4D] border-[#E8E5DE]'
              }">
              <span>🙏</span>
              <span>${isPrayed ? "Você está orando por esta intenção" : "Estou orando por você"}</span>
              <span class="px-2 py-0.5 rounded-full text-xs font-bold ${isPrayed ? 'bg-[#287A58] text-white' : 'bg-white text-[#172B4D] border border-[#E8E5DE]'}">

            </button>

                <button type="button" onclick="openEditPedidoModal('${esc(p.id)}')"
                  class="px-3 py-2 rounded-xl bg-[#FAF8F3] hover:bg-[#E8E5DE]/60 text-[#28313D] text-xs font-semibold border border-[#E8E5DE] transition"
                  title="Editar pedido">

              </div>
            ` : ""}

        </article>
      `;

    window.toggleExpandPrayerText = function(pedidoId) {
      state.expandedPrayerIds[pedidoId] = !state.expandedPrayerIds[pedidoId];
      renderApp();
    };

    window.handlePrayForRequest = async function(pedidoId) {
      if (state.prayedIds[pedidoId]) {
        showToast("Sua intercessão por este pedido já foi registrada com carinho. 🙏", "info");
        return;
      }
      const p = state.pedidos.find(x => x.id === pedidoId);
      if (!p) return;

      state.prayedIds[pedidoId] = true;
      safeSetStorage("po_prayed_ids_v3", state.prayedIds);
      p.oracoes_count = Math.max(0, Number(p.oracoes_count || 0)) + 1;
      safeSetStorage("po_pedidos_v3", state.pedidos);

      renderApp();
      showToast("Obrigado por unir seu coração em oração por esta vida! 🙏", "success");
      await upsertPedidoSupabase(p);
    };

    window.handleLoginSubmit = function(ev) {
      ev.preventDefault();
      const ident = (getEl("login-identificador")?.value || "").trim().toLowerCase();
      const senha = (getEl("login-senha")?.value || "").trim();

      const found = state.usuarios.find(u =>
        (u.email && u.email.toLowerCase() === ident) ||
        (u.username && u.username.toLowerCase() === ident)
      );

      if (!found) {
        showToast("Usuário ou e-mail não encontrado no cadastro.", "error");
        return;
      }
      if (String(found.senha) !== String(senha)) {
        showToast("Senha incorreta. Caso não lembre, clique em 'Esqueci minha senha'.", "error");
        return;
      }

      state.currentUser = found;
      safeSetStorage("po_current_user", found);
      showToast(`Paz seja contigo, ${found.nome}!`, "success");

      if (found.precisa_trocar_senha) {
        state.route = "dashboard";
        renderApp();
        openForcePasswordChangeModal();
      } else {
        navigateTo("dashboard");
      }
    };

    async function processPrayerSubmission(mode) {
      const u = state.currentUser;
      const fs = state.prayerFormState;
      const isLoggedMode = Boolean(u && mode === "logged");

      const rawNome = isLoggedMode ? u.nome : (getEl("guest-nome")?.value || "").trim();
      const rawSobrenome = isLoggedMode ? u.sobrenome : (getEl("guest-sobrenome")?.value || "").trim();
      const sexo = isLoggedMode ? (u.sexo || "Masculino") : (getEl("guest-sexo")?.value || "Masculino");
      const textoEl = getEl(isLoggedMode ? "logged-pedido-texto" : "guest-texto");
      const texto = (textoEl?.value || "").trim();
      const categoria = getEl("prayer-categoria-select")?.value || fs.categoria || "Vida espiritual";
      const privacidade = getEl("prayer-privacidade-select")?.value || fs.privacidade || "publico";

      // Validação Estado 2: Campo obrigatório ausente
      if (!texto) {
        fs.status = "error_missing";
        fs.message = "Por favor, escreva sua intenção de oração antes de enviar.";
        renderApp();
        return;
      }

      if (!fs.anonimo && !rawNome) {
        fs.status = "error_missing";
        fs.message = "Informe seu nome ou marque a opção 'Desejo enviar meu pedido anonimamente'.";
        renderApp();
        const t = getEl(isLoggedMode ? "logged-pedido-texto" : "guest-texto");
        if (t) t.value = texto;
        return;
      }

      // Validação Estado 3: Dados inválidos (texto muito curto)
      if (texto.length < 5) {
        fs.status = "error_invalid";
        fs.message = "Descreva seu pedido com pelo menos algumas palavras para que possamos interceder melhor.";
        renderApp();
        const t = getEl(isLoggedMode ? "logged-pedido-texto" : "guest-texto");
        if (t) {
          t.value = texto;
          updatePrayerCharCount(t);
        }
        return;
      }

      // Estado 4: Enviando pedido
      fs.status = "sending";
      fs.message = "";
      renderApp();

      const novoPedido = {
        id: "ped_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        user_id: isLoggedMode ? u.id : "convidado",
        nome: fs.anonimo ? "Anônimo" : rawNome,
        sobrenome: fs.anonimo ? "" : (rawSobrenome || ""),
        sexo,
        texto,
        categoria,
        anonimo: Boolean(fs.anonimo),
        privacidade,
        oracoes_count: 1,
        criado_em: new Date().toISOString()
      };

      state.pedidos.unshift(novoPedido);
      await upsertPedidoSupabase(novoPedido);

      // Estado 5: Envio concluído com sucesso (mensagem acolhedora exigida)
      fs.status = "success";
      fs.message = "Seu pedido foi recebido com carinho. Que você encontre força, paz e esperança nesta caminhada.";
      showToast("Seu pedido foi recebido com carinho!", "success");
      renderApp();
    }

    // =========================================================================
    // 15. PÁGINA DE CONTATOS (/contatos) COM WHATSAPP, EMAIL, MAPS/WAZE E ADMIN
    // =========================================================================
    function renderContatos() {
      const curr = state.currentUser;
      const currIsAdmin = isAdmin(curr);
      const currIsMaster = isMaster(curr);
      const termo = (state.buscaContatos || "").trim().toLowerCase();

      const filtrados = state.usuarios.filter(u => {
        if (!termo) return true;
        const full = `${u.nome || ""} ${u.sobrenome || ""} ${u.email || ""} ${u.cidade || ""}`.toLowerCase();
        return full.includes(termo);
      });

      const pendentesReset = currIsAdmin ? state.usuarios.filter(u => u.reset_solicitado) : [];

      return `
        <div class="fade-in space-y-6">
          ${pendentesReset.length > 0 ? `
            <div class="bg-[#F5EFE2] border border-[#C4A46A] rounded-3xl p-5 space-y-3">
              <h2 class="font-bold text-sm text-[#203653] flex items-center gap-2">
                <span>🔑 Solicitações Pendentes de Redefinição de Senha (${pendentesReset.length})</span>
              </h2>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${pendentesReset.map(u => `
                  <div class="bg-white rounded-2xl p-3.5 border border-[#E8E5DE] flex items-center justify-between gap-3">
                    <div>
                      <p class="font-bold text-xs text-[#28313D]">${esc(u.nome)} ${esc(u.sobrenome)}</p>
                      <p class="text-[11px] text-[#687386]">${esc(u.email)}</p>
                    </div>
                    <button type="button" onclick="adminResetPassword('${esc(u.id)}')"
                      class="px-3.5 py-2 rounded-xl bg-[#172B4D] hover:bg-[#203653] text-white text-xs font-semibold">
                      Aprovar Reset (1234)
                    </button>
                  </div>
                `).join("")}
              </div>
            </div>
          ` : ""}

          <div class="surface-card p-6 sm:p-8 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-[#E8E5DE] pb-4">
              <div>
                <h1 class="serif-title text-2xl sm:text-3xl font-bold">Contatos da Comunidade</h1>
                <p class="text-xs sm:text-sm text-[#687386]">Converse via WhatsApp, envie e-mail ou abra o endereço no Google Maps ou Waze</p>
              </div>
              <div class="flex items-center gap-2">
                <input type="search" aria-label="Buscar contatos por nome ou cidade" placeholder="Buscar por nome ou cidade..." value="${esc(state.buscaContatos)}"
                  oninput="handleBuscaContatos(this.value)"
                  class="px-4 py-2.5 form-input-premium text-xs sm:text-sm" />
                <button type="button" onclick="navigateTo('dashboard')"
                  class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-[#FAF8F3] hover:bg-[#F3EFE6] text-[#172B4D] border border-[#E8E5DE]">
                  ← Painel
                </button>
              </div>
            </div>

            <div class="divide-y divide-[#E8E5DE]">
              ${filtrados.map(u => {
                const foneDigits = String(u.telefone || "").replace(/\D/g, "");
                const whatsPhone = foneDigits.length >= 10 ? (foneDigits.startsWith("55") ? foneDigits : "55" + foneDigits) : "";
                const targetIsMaster = isMaster(u);
                const targetIsAdmin = isAdmin(u);
                const bday = getBirthdayInfo(u.data_nascimento);

                const canModifyTarget = currIsAdmin && (!targetIsMaster || currIsMaster);
                const canDeleteTarget = currIsAdmin && !targetIsMaster && u.id !== curr.id;

                return `
                  <div class="py-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div class="flex items-center gap-3.5">
                      <img src="${esc(u.foto || DEFAULT_AVATAR)}" alt="${esc(u.nome)}"
                        class="w-14 h-14 rounded-full object-cover border border-[#C4A46A] flex-shrink-0 bg-[#FAF8F3]" />
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <h3 class="font-bold text-base text-[#28313D]">${esc(u.nome)} ${esc(u.sobrenome)}</h3>
                          ${targetIsMaster
                            ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#F5EFE2] text-[#8C6D32] border border-[#E6D8BC]">Admin Master</span>'
                            : targetIsAdmin
                            ? '<span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-[#EBF0EC] text-[#287A58] border border-[#CFE0D5]">Administrador</span>'
                            : ''}
                          ${u.reset_solicitado ? '<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#B54747]/10 text-[#B54747]">Solicitou Reset</span>' : ''}
                        </div>
                        <p class="text-xs text-[#687386]">${esc(u.email)} • ${esc(u.telefone || "Sem telefone")}</p>
                        ${bday ? `<p class="text-xs text-[#8C6D32] font-medium mt-0.5">🎂 Aniversário: ${esc(bday.shortDate)} (${esc(bday.badgeTexto)})</p>` : ""}
                      </div>
                    </div>

                    <div class="flex flex-wrap items-center gap-2">
                      ${whatsPhone ? `
                        <a href="https://api.whatsapp.com/send?phone=${whatsPhone}" target="_blank" rel="noopener noreferrer"
                          class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#287A58] hover:bg-[#1E5E43] text-white text-xs font-semibold shadow-sm transition">
                          <span>💬 WhatsApp</span>
                        </a>
                      ` : ""}

                      ${u.email ? `
                        <a href="mailto:${esc(u.email)}"
                          class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#FAF8F3] hover:bg-[#F3EFE6] text-[#172B4D] border border-[#E8E5DE] text-xs font-semibold transition">
                          <span>✉️ E-mail</span>
                        </a>
                      ` : ""}

                      <button type="button" onclick="openMapsSelectorModal('${esc(u.id)}')"
                        class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-[#FAF8F3] hover:bg-[#F3EFE6] text-[#172B4D] border border-[#E8E5DE] text-xs font-semibold transition">
                        <span>📍 Maps / Waze</span>
                      </button>

                      ${canModifyTarget ? `
                        <button type="button" onclick="adminResetPassword('${esc(u.id)}')"
                          class="px-3 py-2 rounded-xl bg-[#F5EFE2] hover:bg-[#EFE4CE] text-[#8C6D32] text-xs font-semibold transition"
                          title="Redefinir senha individualmente para 1234">
                          🔑 Reset 1234
                        </button>
                        <button type="button" onclick="openAdminEditUserModal('${esc(u.id)}')"
                          class="px-3 py-2 rounded-xl bg-[#FAF8F3] hover:bg-[#F3EFE6] text-[#28313D] border border-[#E8E5DE] text-xs font-semibold transition">
                          ✏️ Editar
                        </button>
                      ` : ""}

                      ${currIsAdmin && !targetIsMaster ? `
                        ${targetIsAdmin && currIsMaster ? `
                          <button type="button" onclick="adminToggleRole('${esc(u.id)}', 'user')"
                            class="px-3 py-2 rounded-xl bg-[#F5EFE2] hover:bg-[#EFE4CE] text-[#8C6D32] text-xs font-semibold transition">
                            ⬇️ Rebaixar
                          </button>
                        ` : !targetIsAdmin ? `
                          <button type="button" onclick="adminToggleRole('${esc(u.id)}', 'admin')"
                            class="px-3 py-2 rounded-xl bg-[#EBF0EC] hover:bg-[#dce6de] text-[#287A58] text-xs font-semibold transition">
                            ⬆️ Promover Admin
                          </button>
                        ` : ""}
                      ` : ""}

                      ${canDeleteTarget ? `
                        <button type="button" onclick="adminDeleteUser('${esc(u.id)}')"
                          class="px-3 py-2 rounded-xl bg-[#B54747]/10 hover:bg-[#B54747]/20 text-[#B54747] text-xs font-semibold transition">
                          🗑️ Excluir
                        </button>
                      ` : ""}
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    }

    window.handleBuscaContatos = function(val) {
      state.buscaContatos = val;
      renderApp();
    };

    window.openMapsSelectorModal = function(userId) {
      const u = state.usuarios.find(x => x.id === userId);
      if (!u) return;
      const enderecoStr = [u.rua, u.numero, u.bairro, u.cidade, u.estado, u.cep]
        .filter(Boolean)
        .join(", ");
      const queryEncoded = encodeURIComponent(enderecoStr || "Brasil");

      openModal(`
        <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-7 shadow-2xl border border-[#E8E5DE] space-y-4 fade-in">
          <div class="flex items-center justify-between">
            <h3 class="serif-title text-xl font-bold">📍 Abrir Localização</h3>
            <button type="button" onclick="closeModal()" class="text-[#687386] hover:text-[#172B4D] text-xl font-bold" aria-label="Fechar">✕</button>
          </div>
          <p class="text-sm text-[#687386]">
            <strong class="text-[#28313D]">${esc(u.nome)} ${esc(u.sobrenome)}:</strong><br/>
            ${esc(enderecoStr || "Endereço não informado")}
          </p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
            <a href="https://www.google.com/maps/search/?api=1&query=${queryEncoded}" target="_blank" rel="noopener noreferrer"
              onclick="closeModal()"
              class="py-3 px-4 rounded-xl bg-[#172B4D] hover:bg-[#203653] text-white font-semibold text-xs sm:text-sm text-center shadow-sm">
              🗺️ Google Maps
            </a>
            <a href="https://waze.com/ul?q=${queryEncoded}&navigate=yes" target="_blank" rel="noopener noreferrer"
              onclick="closeModal()"
              class="py-3 px-4 rounded-xl bg-[#287A58] hover:bg-[#1E5E43] text-white font-semibold text-xs sm:text-sm text-center shadow-sm">
              🚗 Abrir no Waze
            </a>
          </div>
        </div>
      `);
    };

    window.adminResetPassword = async function(userId) {
      const target = state.usuarios.find(u => u.id === userId);
      if (!target) return;
      if (isMaster(target) && !isMaster(state.currentUser)) {
        showToast("Apenas o Administrador Master pode modificar seu próprio cadastro.", "error");
        return;
      }
      target.senha = "1234";

    function getFilteredPedidos() {
      const f = state.filtrosPedidos;
      const u = state.currentUser;
      const currIsAdmin = isAdmin(u);
      const now = new Date();
      const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

      return state.pedidos.filter(p => {
        // Respeita o controle de privacidade: pedidos reservados só aparecem para administradores ou para o próprio autor
        if (p.privacidade === "reservado" && !currIsAdmin && (!u || p.user_id !== u.id)) {
          return false;
        }

        const dt = new Date(p.criado_em);
        if (f.semana && dt < sevenDaysAgo) return false;
        if (f.mes && (dt.getMonth() !== now.getMonth() || dt.getFullYear() !== now.getFullYear())) return false;

        if (f.masculino && !f.feminino && p.sexo !== "Masculino") return false;
        if (f.feminino && !f.masculino && p.sexo !== "Feminino") return false;

        if (f.categoria && f.categoria !== "Todas" && p.categoria !== f.categoria) {
          return false;
        }

        if (f.busca) {
          const hay = `${p.anonimo ? "anônimo" : (p.nome || "")} ${p.anonimo ? "" : (p.sobrenome || "")} ${p.texto || ""} ${p.categoria || ""}`.toLowerCase();
          if (!hay.includes(f.busca.toLowerCase())) return false;
        }
        return true;
      });
    }

                  Limpar filtros

            </div>

            <!-- Grade de Cartões do Mural -->
            ${listaCompleta.length === 0 ? `

    window.exportPedidosWhatsApp = function() {

      if (lista.length === 0) {

        return;
      }

      const linhas = [
        "🙏 *PORTAL DE INTERCESSÃO — PEDIDOS DE ORAÇÃO* 🙏",
        `📅 _Lista gerada em ${formatDateTimeBR(new Date().toISOString())}_`,
        "──────────────────────"
      ];

      lista.forEach((p, idx) => {
        const autor = p.anonimo || String(p.nome).toLowerCase() === "anônimo"
          ? "Anônimo"
          : `${p.nome} ${p.sobrenome || ""}`.trim();
        linhas.push(
          `\n*${idx + 1}. ${autor}* [${p.categoria || "Oração"}] (${formatDateTimeBR(p.criado_em)})`,
          `💬 _"${p.texto}"_`
        );
      });

      linhas.push("\n──────────────────────", "✨ _\"Orai uns pelos outros, para que sareis.\" (Tiago 5:16)_");
      const textoFinal = linhas.join("\n");
      const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textoFinal);
      window.open(url, "_blank", "noopener,noreferrer");
    };

                <div>
                  <label for="perf-numero" class="block text-xs font-semibold text-[#28313D] mb-1">Número</label>
                  <input id="perf-numero" type="text" value="${esc(u.numero || '')}" class="w-full px-3.5 py-2.5 form-input-premium text-sm" />
                </div>
                <div class="sm:col-span-2">
                  <label for="perf-complemento" class="block text-xs font-semibold text-[#28313D] mb-1">Complemento</label>
                  <input id="perf-complemento" type="text" value="${esc(u.complemento || '')}" class="w-full px-3.5 py-2.5 form-input-premium text-sm" />
                </div>
                <div>
                  <label for="perf-bairro" class="block text-xs font-semibold text-[#28313D] mb-1">Bairro</label>
                  <input id="perf-bairro" type="text" value="${esc(u.bairro || '')}" class="w-full px-3.5 py-2.5 form-input-premium text-sm" />
                </div>
                <div>
                  <label for="perf-cidade" class="block text-xs font-semibold text-[#28313D] mb-1">Cidade</label>
                  <input id="perf-cidade" type="text" value="${esc(u.cidade || '')}" class="w-full px-3.5 py-2.5 form-input-premium text-sm" />
                </div>
                <div>
                  <label for="perf-estado" class="block text-xs font-semibold text-[#28313D] mb-1">Estado (UF)</label>
                  <input id="perf-estado" type="text" maxlength="2" value="${esc(u.estado || '')}" class="w-full px-3.5 py-2.5 form-input-premium text-sm uppercase" />
                </div>
              </div>

              <div>
                <label for="perf-nova-senha" class="block text-sm font-medium text-[#28313D] mb-1">Nova Senha (deixe em branco para manter a atual)</label>
                <input id="perf-nova-senha" type="password" placeholder="••••••••" class="w-full px-4 py-3 form-input-premium" />
              </div>

              <button type="submit" class="w-full py-4 btn-primary-navy text-base">
                Salvar Alterações do Perfil
              </button>
            </form>
          </div>
        </div>
      `;
    }

    window.handlePerfilSubmit = async function(ev) {
      ev.preventDefault();
      const u = state.currentUser;
      if (!u) return;

      u.nome = (getEl("perf-nome")?.value || "").trim();
      u.sobrenome = (getEl("perf-sobrenome")?.value || "").trim();
      u.sexo = getEl("perf-sexo")?.value || "Masculino";
      u.data_nascimento = (getEl("perf-nascimento")?.value || "").trim();
      u.telefone = (getEl("perf-telefone")?.value || "").trim();
      u.email = (getEl("perf-email")?.value || "").trim();
      u.cep = (getEl("perf-cep")?.value || "").trim();
      u.rua = (getEl("perf-rua")?.value || "").trim();
      u.numero = (getEl("perf-numero")?.value || "").trim();
      u.complemento = (getEl("perf-complemento")?.value || "").trim();
      u.bairro = (getEl("perf-bairro")?.value || "").trim();
      u.cidade = (getEl("perf-cidade")?.value || "").trim();
      u.estado = (getEl("perf-estado")?.value || "").trim().toUpperCase();

      if (state.tempFotoPerfil) {
        u.foto = state.tempFotoPerfil;
        state.tempFotoPerfil = "";
      }

      const novaSenha = (getEl("perf-nova-senha")?.value || "").trim();
      if (novaSenha) {
        u.senha = novaSenha;
        u.precisa_trocar_senha = false;
      }

      const idx = state.usuarios.findIndex(x => x.id === u.id);
      if (idx !== -1) state.usuarios[idx] = u;
      safeSetStorage("po_current_user", u);

      await upsertUserSupabase(u);
      showToast("Seus dados de perfil foram atualizados!", "success");
      navigateTo("dashboard");
    };

    // =========================================================================
    // 18. MODAL DE CONFIGURAÇÃO DO SUPABASE (EXCLUSIVO PARA ADMINISTRADORES)
    // =========================================================================
    window.openSupabaseAdminModal = function() {
      if (!isAdmin(state.currentUser)) {
        showToast("Acesso restrito aos administradores.", "error");
        return;
      }

      const sqlScript = `-- Execute no SQL Editor do Supabase para criar ou atualizar as tabelas:
create table if not exists public.usuarios (
  id text primary key,
  username text,
  nome text not null,
  sobrenome text not null,
  sexo text not null,
  data_nascimento text,
  telefone text not null,
  email text not null,
  cep text,
  rua text,
  bairro text,
  cidade text,
  estado text,
  numero text,
  complemento text,
  foto_perfil text,
  senha text not null,
  is_admin boolean default false,
  must_change_password boolean default false,
  reset_requested boolean default false,
  created_at timestamptz default now()
);

alter table public.usuarios add column if not exists data_nascimento text;

create table if not exists public.pedidos_oracao (
  id text primary key,
  user_id text,
  nome text not null,
  sobrenome text not null,
  sexo text not null,
  pedido text not null,
  created_at timestamptz default now()
);

alter table public.usuarios enable row level security;
alter table public.pedidos_oracao enable row level security;

drop policy if exists "Acesso publico usuarios" on public.usuarios;
create policy "Acesso publico usuarios" on public.usuarios for all to public using (true) with check (true);

drop policy if exists "Acesso publico pedidos" on public.pedidos_oracao;
create policy "Acesso publico pedidos" on public.pedidos_oracao for all to public using (true) with check (true);

NOTIFY pgrst, 'reload schema';`;

      openModal(`
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl border border-[#E8E5DE] space-y-4 fade-in max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-[#E8E5DE] pb-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-[#F5EFE2] text-[#8C6D32]">Exclusivo Administrador</span>
              <h3 class="serif-title text-xl font-bold mt-1">⚙️ Conexão Supabase &amp; Banco de Dados</h3>
            </div>
            <button type="button" onclick="closeModal()" class="text-[#687386] hover:text-[#172B4D] text-xl font-bold" aria-label="Fechar">✕</button>
          </div>

          ${state.sbLastError ? `
            <div class="p-3.5 rounded-2xl bg-[#B54747]/10 border border-[#B54747] text-xs text-[#B54747]">
              <strong>Último aviso de conexão:</strong> ${esc(state.sbLastError)}
            </div>
          ` : `
            <div class="p-3.5 rounded-2xl bg-[#EBF0EC] border border-[#829889] text-xs text-[#287A58]">
              ✅ Conectado e sincronizado com as tabelas <code>usuarios</code> e <code>pedidos_oracao</code> do seu Supabase!
            </div>
          `}

          <div class="space-y-3">
            <div>
              <label for="sb-input-url" class="block text-xs font-semibold text-[#28313D] mb-1">Supabase URL</label>
              <input id="sb-input-url" type="text" value="${esc(state.sbUrl)}"
                class="w-full px-3.5 py-2.5 form-input-premium text-xs font-mono" />
            </div>
            <div>
              <label for="sb-input-key" class="block text-xs font-semibold text-[#28313D] mb-1">Supabase Anon Key</label>
              <input id="sb-input-key" type="text" value="${esc(state.sbKey)}"
                class="w-full px-3.5 py-2.5 form-input-premium text-xs font-mono" />
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="saveAndSyncSupabaseAdmin()"
                class="px-4 py-2.5 rounded-xl bg-[#287A58] hover:bg-[#1E5E43] text-white text-xs font-semibold">
                🔄 Salvar e Sincronizar Agora
              </button>
              <button type="button" onclick="copySqlScript()"
                class="px-4 py-2.5 rounded-xl bg-[#172B4D] hover:bg-[#203653] text-white text-xs font-semibold">
                📋 Copiar Script SQL
              </button>
            </div>
          </div>

          <div>
            <label for="sb-sql-textarea" class="block text-xs font-semibold text-[#28313D] mb-1">Script SQL para o SQL Editor do Supabase:</label>
            <textarea id="sb-sql-textarea" readonly rows="7"
              class="w-full p-3 rounded-xl bg-[#172B4D] text-[#FAF8F3] text-[11px] font-mono">${esc(sqlScript)}</textarea>
          </div>
        </div>
      `);
    };

    window.saveAndSyncSupabaseAdmin = async function() {
      const urlVal = (getEl("sb-input-url")?.value || DEFAULT_SUPABASE_URL).trim();
      const keyVal = (getEl("sb-input-key")?.value || DEFAULT_SUPABASE_KEY).trim();
      state.sbUrl = urlVal;
      state.sbKey = keyVal;
      safeSetStorage("po_sb_url", urlVal);
      safeSetStorage("po_sb_key", keyVal);
      closeModal();
      await syncFromSupabase(false);
    };

    window.copySqlScript = function() {
      const area = getEl("sb-sql-textarea");
      if (!area) return;
      area.select();
      try {
        document.execCommand("copy");
        showToast("Script SQL copiado para a área de transferência!", "success");
      } catch (e) {
        showToast("Selecione o texto acima para copiar.", "info");
      }
    };

    // =========================================================================
    // 19. RENDERIZADOR PRINCIPAL (SÍNCRONO E INSTANTÂNEO)
    // =========================================================================
    function renderApp() {
      renderHeader();
      renderFooter();

      const main = document.getElementById("app-main");
      if (!main) return;

      switch (state.route) {
        case "login":
          main.innerHTML = renderLogin();
          break;
        case "cadastro":
          main.innerHTML = renderCadastro();
          break;
        case "pedidoconvidado":
          main.innerHTML = renderPedidoConvidado();
          break;
        case "dashboard":
          main.innerHTML = renderDashboard();
          break;
        case "contatos":
          main.innerHTML = renderContatos();
          break;
        case "pedidooracao":
          main.innerHTML = renderPedidoOracao();
          break;
        case "acompanharpedidos":
          main.innerHTML = renderAcompanharPedidos();
          break;
        case "aniversariantes":
          main.innerHTML = renderAniversariantes();
          break;
        case "perfil":
          main.innerHTML = renderPerfil();
          break;
        case "home":
        default:
          main.innerHTML = renderHomePublic();
          break;
      }
    }

    (function initApp() {
      state.route = detectInitialRoute();
      if (PROTECTED_ROUTES.includes(state.route) && !state.currentUser) {
        state.route = "login";
      }
      renderApp();
      syncFromSupabase(true);
    })();
  </script>
</body>
</html>
