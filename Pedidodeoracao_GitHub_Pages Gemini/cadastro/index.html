    function safeGetStorage(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? JSON.parse(val) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function safeSetStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {

      }

    function normalizeSupabaseRestUrl(rawUrl) {
      let clean = String(rawUrl || DEFAULT_SUPABASE_URL).trim();
      if (!clean) clean = DEFAULT_SUPABASE_URL;
      clean = clean.replace(/\/+$/, "");
      if (clean.endsWith("/rest/v1")) {
        return clean;
      }
      return clean + "/rest/v1";

    const state = {

    // Garante que o admin_master sempre exista e nunca perca o papel master
    function ensureMasterIntegrity() {
      if (!Array.isArray(state.usuarios)) {
        state.usuarios = [createInitialAdmin()];
      }
      const idx = state.usuarios.findIndex(u => u.id === "admin_master" || (u.username || "").toLowerCase() === "admin");
      if (idx === -1) {
        state.usuarios.unshift(createInitialAdmin());
      } else {
        state.usuarios[idx].id = "admin_master";
        state.usuarios[idx].username = "admin";
        state.usuarios[idx].role = "master";
      }
      // Desempacota data_nascimento caso tenha vindo embutida no complemento do Supabase
      state.usuarios.forEach(u => {
        if (!u.data_nascimento && u.complemento && u.complemento.includes("[NASC:")) {
          const m = u.complemento.match(/\[NASC:([0-9]{4}-[0-9]{2}-[0-9]{2})\]/);
          if (m) {
            u.data_nascimento = m[1];
            u.complemento = u.complemento.replace(/\s*\[NASC:[0-9]{4}-[0-9]{2}-[0-9]{2}\]/g, "").trim();
          }
        }
      });
      if (state.currentUser) {
        const fresh = state.usuarios.find(u => u.id === state.currentUser.id);
        if (fresh) {
          state.currentUser = fresh;
          safeSetStorage("po_current_user", fresh);
        }
      }
    }

    ensureMasterIntegrity();

    function isAdmin(user) {
      if (!user) return false;
      return user.role === "master" || user.role === "admin" || user.id === "admin_master";
    }

    function isMaster(user) {
      if (!user) return false;
      return user.role === "master" || user.id === "admin_master";
    }

    // =========================================================================
    // 3. CÁLCULO DE DATA DE NASCIMENTO E IDADE DO ANIVERSARIANTE
    // =========================================================================
    function parseBirthDate(dateStr) {
      if (!dateStr || typeof dateStr !== "string") return null;
      const clean = dateStr.trim();
      // YYYY-MM-DD
      let m = clean.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (m) {
        return {
          year: parseInt(m[1], 10),
          month: parseInt(m[2], 10),
          day: parseInt(m[3], 10),
          iso: `${m[1]}-${m[2]}-${m[3]}`
        };
      }
      // DD/MM/YYYY
      m = clean.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
      if (m) {
        return {
          year: parseInt(m[3], 10),
          month: parseInt(m[2], 10),
          day: parseInt(m[1], 10),
          iso: `${m[3]}-${m[2]}-${m[1]}`
        };
      }
      return null;
    }

    function getBirthdayInfo(dateStr) {
      const parsed = parseBirthDate(dateStr);
      if (!parsed || !parsed.year || parsed.year < 1900 || parsed.year > new Date().getFullYear()) {
        return null;
      }
      const now = new Date();
      const currentYear = now.getFullYear();
      const currentMonth = now.getMonth() + 1;
      const currentDay = now.getDate();

      // Idade que a pessoa está fazendo neste ano
      const idadeFazendo = Math.max(0, currentYear - parsed.year);
      const isToday = (parsed.month === currentMonth && parsed.day === currentDay);
      const alreadyPassedThisYear = (parsed.month < currentMonth) || (parsed.month === currentMonth && parsed.day < currentDay);

      const dayPad = String(parsed.day).padStart(2, "0");
      const monthPad = String(parsed.month).padStart(2, "0");

      return {
        ...parsed,
        idadeFazendo,
        isToday,
        alreadyPassedThisYear,
        shortDate: `${dayPad}/${monthPad}`,
        fullDateFormatted: `${dayPad}/${monthPad}/${parsed.year}`,
        extensoDate: `${dayPad} de ${MESES_NOMES[parsed.month - 1]}`,
        badgeTexto: isToday
          ? `🎉 Hoje! Fazendo ${idadeFazendo} anos`
          : `🎂 Fazendo ${idadeFazendo} anos`
      };
    }

    function getAniversariantesPorMes(mesFiltro) {
      const targetMonth = Number(mesFiltro);
      return state.usuarios
        .map(u => {
          const info = getBirthdayInfo(u.data_nascimento);
          return info ? { user: u, bday: info } : null;
        })
        .filter(item => {
          if (!item) return false;
          if (targetMonth === 0) return true; // Todos os meses
          return item.bday.month === targetMonth;
        })
        .sort((a, b) => {
          if (a.bday.month !== b.bday.month) return a.bday.month - b.bday.month;
          return a.bday.day - b.bday.day;
        });
    }

    // =========================================================================
    // 4. INTEGRAÇÃO SUPABASE (ASSÍNCRONA, COM TIMEOUT E FALLBACK AUTOMÁTICO)
    // =========================================================================
    async function sbFetch(tableAndQuery, options = {}) {
      const restBase = normalizeSupabaseRestUrl(state.sbUrl);
      const key = String(state.sbKey || DEFAULT_SUPABASE_KEY).trim();
      const url = `${restBase}/${tableAndQuery.replace(/^\/+/, "")}`;

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6500);

      try {
        const headers = Object.assign({
          "apikey": key,
          "Authorization": `Bearer ${key}`,
          "Content-Type": "application/json"
        }, options.headers || {});

        const response = await fetch(url, Object.assign({}, options, {
          headers,
          signal: controller.signal
        }));
        clearTimeout(timer);

        if (!response.ok) {
          let errText = "";
          try { errText = await response.text(); } catch (e) {}
          throw new Error(`HTTP ${response.status}: ${errText}`);
        }
        const text = await response.text();
        return text ? JSON.parse(text) : null;
      } catch (err) {
        clearTimeout(timer);
        throw err;
      }
    }

    function sanitizeUserForSupabase(u, includeBirthColumn = true) {
      let comp = u.complemento || "";
      comp = comp.replace(/\s*\[NASC:[0-9]{4}-[0-9]{2}-[0-9]{2}\]/g, "").trim();
      if (!includeBirthColumn && u.data_nascimento) {
        comp = (comp + ` [NASC:${u.data_nascimento}]`).trim();
      }
      const payload = {
        id: u.id,
        username: u.username || "",
        nome: u.nome || "",
        sobrenome: u.sobrenome || "",
        sexo: u.sexo || "Masculino",
        telefone: u.telefone || "",
        email: u.email || "",
        cep: u.cep || "",
        rua: u.rua || "",
        numero: u.numero || "",
        complemento: comp,
        bairro: u.bairro || "",
        cidade: u.cidade || "",
        estado: u.estado || "",
        senha: u.senha || "",
        foto: u.foto || DEFAULT_AVATAR,
        role: u.role || "user",
        precisa_trocar_senha: Boolean(u.precisa_trocar_senha),
        reset_solicitado: Boolean(u.reset_solicitado),
        criado_em: u.criado_em || new Date().toISOString()
      };
      if (includeBirthColumn) {
        payload.data_nascimento = u.data_nascimento || "";
      }
      return payload;
    }

    async function upsertUserSupabase(userObj) {
      ensureMasterIntegrity();
      safeSetStorage("po_usuarios_v3", state.usuarios);
      try {
        await sbFetch("usuarios?on_conflict=id", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify(sanitizeUserForSupabase(userObj, true))
        });
        state.sbStatus = "connected";
        state.sbLastError = "";
      } catch (err) {
        // Fallback caso a tabela remota ainda não tenha a coluna data_nascimento criada
        try {
          await sbFetch("usuarios?on_conflict=id", {
            method: "POST",
            headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
            body: JSON.stringify(sanitizeUserForSupabase(userObj, false))
          });
          state.sbStatus = "connected";
          state.sbLastError = "";
        } catch (err2) {
          state.sbStatus = "offline";
          state.sbLastError = err2.message || "Falha de comunicação com o Supabase";
        }
      }
      if (isAdmin(state.currentUser)) renderHeader();
    }

    async function deleteUserSupabase(userId) {
      if (userId === "admin_master") return;
      safeSetStorage("po_usuarios_v3", state.usuarios);
      try {
        await sbFetch(`usuarios?id=eq.${encodeURIComponent(userId)}`, {
          method: "DELETE"
        });
        state.sbStatus = "connected";
      } catch (err) {
        state.sbStatus = "offline";
        state.sbLastError = err.message || "";
      }
    }

    async function upsertPedidoSupabase(pedidoObj) {
      safeSetStorage("po_pedidos_v3", state.pedidos);
      try {
        await sbFetch("pedidos?on_conflict=id", {
          method: "POST",
          headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
          body: JSON.stringify({
            id: pedidoObj.id,
            user_id: pedidoObj.user_id || "guest",
            nome: pedidoObj.nome || "",
            sobrenome: pedidoObj.sobrenome || "",
            sexo: pedidoObj.sexo || "Masculino",
            texto: pedidoObj.texto || "",
            criado_em: pedidoObj.criado_em || new Date().toISOString()
          })
        });
        state.sbStatus = "connected";
        state.sbLastError = "";
      } catch (err) {
        state.sbStatus = "offline";
        state.sbLastError = err.message || "Erro ao gravar pedido no Supabase";
      }
      if (isAdmin(state.currentUser)) renderHeader();
    }

    async function deletePedidoSupabase(pedidoId) {
      safeSetStorage("po_pedidos_v3", state.pedidos);
      try {
        await sbFetch(`pedidos?id=eq.${encodeURIComponent(pedidoId)}`, {
          method: "DELETE"
        });
        state.sbStatus = "connected";
      } catch (err) {
        state.sbStatus = "offline";
      }
    }

    async function syncFromSupabase(silent = true) {
      state.sbStatus = "syncing";
      if (isAdmin(state.currentUser)) renderHeader();

      try {
        const [remUsers, remPedidos] = await Promise.all([
          sbFetch("usuarios?select=*"),
          sbFetch("pedidos?select=*&order=criado_em.desc")
        ]);

        if (Array.isArray(remUsers)) {
          if (remUsers.length === 0) {
            // Sobe o admin master inicial se o banco estiver vazio
            const master = state.usuarios.find(u => u.id === "admin_master") || createInitialAdmin();
            await upsertUserSupabase(master);
          } else {
            // Mescla preservando dados locais caso ainda não sincronizados
            const mapById = new Map();
            state.usuarios.forEach(u => mapById.set(u.id, u));
            remUsers.forEach(ru => {
              const localU = mapById.get(ru.id);
              if (localU && localU.data_nascimento && !ru.data_nascimento) {
                ru.data_nascimento = localU.data_nascimento;
              }
              mapById.set(ru.id, Object.assign({}, localU || {}, ru));
            });
            state.usuarios = Array.from(mapById.values());
            ensureMasterIntegrity();
            safeSetStorage("po_usuarios_v3", state.usuarios);
          }
        }

        if (Array.isArray(remPedidos)) {
          const mapPed = new Map();
          state.pedidos.forEach(p => mapPed.set(p.id, p));
          remPedidos.forEach(rp => mapPed.set(rp.id, rp));
          state.pedidos = Array.from(mapPed.values()).sort(
            (a, b) => new Date(b.criado_em) - new Date(a.criado_em)
          );
          safeSetStorage("po_pedidos_v3", state.pedidos);
        }

        state.sbStatus = "connected";
        state.sbLastError = "";
        if (!silent) showToast("Sincronizado com o Supabase com sucesso!", "success");
      } catch (err) {
        state.sbStatus = "offline";
        state.sbLastError = err.message || "Falha ao conectar no Supabase";
        if (!silent) showToast("Modo offline ativo: verifique as tabelas no painel do Administrador.", "warning");
      }

      renderApp();
    }

    // =========================================================================
    // 5. SISTEMA DE ROTAS (SPA + MULTI-PÁGINAS GITHUB PAGES)
    // =========================================================================
    const VALID_ROUTES = [
      "home", "login", "cadastro", "pedidoconvidado",
      "dashboard", "contatos", "pedidooracao", "acompanharpedidos",
      "aniversariantes", "perfil"
    ];

    const PROTECTED_ROUTES = [
      "dashboard", "contatos", "pedidooracao", "acompanharpedidos",
      "aniversariantes", "perfil"
    ];

    function detectInitialRoute() {
      // 1. Verifica hash (#/login) ou query (?route=login)
      const hash = (window.location.hash || "").replace(/^#\/?/, "").trim().toLowerCase();
      if (VALID_ROUTES.includes(hash)) return hash;

      const params = new URLSearchParams(window.location.search || "");
      const qRoute = (params.get("p") || params.get("route") || "").toLowerCase();
      if (VALID_ROUTES.includes(qRoute)) return qRoute;

      // 2. Verifica pathname (/Pedidodeoracao/login)
      const path = (window.location.pathname || "").toLowerCase().replace(/\/index\.html$/, "").replace(/\/+$/, "");
      const lastSeg = path.split("/").filter(Boolean).pop() || "";
      if (VALID_ROUTES.includes(lastSeg)) return lastSeg;

      // 3. Verifica rota embutida no HTML de subpasta
      const embedded = (window.__INITIAL_ROUTE__ || "").toLowerCase();
      if (VALID_ROUTES.includes(embedded) && embedded !== "home") return embedded;

      return state.currentUser ? "dashboard" : "home";
    }

    window.navigateTo = function(targetRoute) {
      let next = String(targetRoute || "home").toLowerCase().trim();
      if (!VALID_ROUTES.includes(next)) next = "home";

      if (PROTECTED_ROUTES.includes(next) && !state.currentUser) {
        showToast("Faça login para acessar esta área.", "warning");
        next = "login";
      }

      if (state.currentUser && state.currentUser.precisa_trocar_senha && next !== "home" && next !== "login") {
        state.route = next;
        renderApp();
        openForcePasswordChangeModal();
        return;
      }

      state.route = next;
      try {
        const isGitHubHost = window.location.hostname.includes("github.io");
        if (isGitHubHost) {
          const newUrl = next === "home" || next === "dashboard"
            ? `${GITHUB_BASE_PATH}/`
            : `${GITHUB_BASE_PATH}/${next}`;
          window.history.pushState({ route: next }, "", newUrl);
        } else {
          window.location.hash = next === "home" ? "" : `#/${next}`;
        }
      } catch (e) {
        // Ignora bloqueios de history em sandbox iframe
      }

      window.scrollTo({ top: 0, behavior: "smooth" });
      renderApp();
    };

    window.addEventListener("popstate", function() {
      state.route = detectInitialRoute();
      renderApp();
    });

    // =========================================================================
    // 6. UTILITÁRIOS DE UI (TOASTS, MODAIS, ESCAPE HTML, MÁSCARAS)
    // =========================================================================
    function esc(str) {
      return String(str === undefined || str === null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const colors = {
        success: "bg-emerald-700 text-white border-emerald-800",
        error: "bg-rose-700 text-white border-rose-800",
        warning: "bg-amber-600 text-white border-amber-700",
        info: "bg-slate-800 text-white border-slate-900"
      };
      const el = document.createElement("div");
      el.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-xl shadow-lg border text-sm font-medium fade-in ${colors[type] || colors.info}`;
      el.innerHTML = `<span>${esc(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 3800);
    }

    window.closeModal = function() {
      const root = document.getElementById("modal-root");
      if (!root) return;
      root.classList.add("hidden");
      root.classList.remove("flex");
      root.innerHTML = "";
    };

    function openModal(htmlContent) {
      const root = document.getElementById("modal-root");
      if (!root) return;
      root.innerHTML = htmlContent;
      root.classList.remove("hidden");
      root.classList.add("flex");
    }

    function formatDateTimeBR(isoString) {
      if (!isoString) return "";
      const d = new Date(isoString);
      if (isNaN(d.getTime())) return isoString;
      const dia = String(d.getDate()).padStart(2, "0");
      const mes = String(d.getMonth() + 1).padStart(2, "0");
      const ano = d.getFullYear();
      const hora = String(d.getHours()).padStart(2, "0");
      const min = String(d.getMinutes()).padStart(2, "0");
      return `${dia}/${mes}/${ano} às ${hora}:${min}`;
    }

    window.maskPhone = function(input) {
      let v = input.value.replace(/\D/g, "").slice(0, 11);
      if (v.length > 6) {
        v = `(${v.slice(0,2)}) ${v.slice(2, v.length - 4)}-${v.slice(-4)}`;
      } else if (v.length > 2) {
        v = `(${v.slice(0,2)}) ${v.slice(2)}`;
      }
      input.value = v;
    };

    window.maskCepAndLookup = async function(input, prefix) {
      let digits = input.value.replace(/\D/g, "").slice(0, 8);
      input.value = digits.length > 5 ? `${digits.slice(0,5)}-${digits.slice(5)}` : digits;
      if (digits.length === 8) {
        const statusEl = document.getElementById(`${prefix}-cep-status`);
        if (statusEl) statusEl.textContent = "Buscando CEP...";
        try {
          const resp = await fetch(`https://viacep.com.br/ws/${digits}/json/`);
          const data = await resp.json();
          if (!data.erro) {
            const ruaEl = document.getElementById(`${prefix}-rua`);
            const bairroEl = document.getElementById(`${prefix}-bairro`);
            const cidadeEl = document.getElementById(`${prefix}-cidade`);
            const estadoEl = document.getElementById(`${prefix}-estado`);
            if (ruaEl) ruaEl.value = data.logradouro || "";
            if (bairroEl) bairroEl.value = data.bairro || "";
            if (cidadeEl) cidadeEl.value = data.localidade || "";
            if (estadoEl) estadoEl.value = data.uf || "";
            if (statusEl) statusEl.textContent = "Endereço preenchido!";
            const numEl = document.getElementById(`${prefix}-numero`);
            if (numEl) numEl.focus();
          } else {
            if (statusEl) statusEl.textContent = "CEP não encontrado. Preencha manualmente.";
          }
        } catch (e) {
          if (statusEl) statusEl.textContent = "Preencha o endereço abaixo.";
        }
      }
    };

    window.handlePhotoInput = function(fileInput, targetPreviewId, stateKey) {
      const file = fileInput.files && fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const MAX = 260;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > MAX) { h = Math.round((h * MAX) / w); w = MAX; }
          } else {
            if (h > MAX) { w = Math.round((w * MAX) / h); h = MAX; }
          }
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          state[stateKey] = dataUrl;
          const prev = document.getElementById(targetPreviewId);
          if (prev) prev.src = dataUrl;
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };

        renderApp();

    window.handleCadastroSubmit = async function(ev) {
      ev.preventDefault();
      const nome = (document.getElementById("cad-nome")?.value || "").trim();
      const sobrenome = (document.getElementById("cad-sobrenome")?.value || "").trim();
      const sexo = document.getElementById("cad-sexo")?.value || "Masculino";
      const data_nascimento = (document.getElementById("cad-nascimento")?.value || "").trim();
      const telefone = (document.getElementById("cad-telefone")?.value || "").trim();
      const email = (document.getElementById("cad-email")?.value || "").trim().toLowerCase();
      const cep = (document.getElementById("cad-cep")?.value || "").trim();
      const rua = (document.getElementById("cad-rua")?.value || "").trim();
      const numero = (document.getElementById("cad-numero")?.value || "").trim();
      const complemento = (document.getElementById("cad-complemento")?.value || "").trim();
      const bairro = (document.getElementById("cad-bairro")?.value || "").trim();
      const cidade = (document.getElementById("cad-cidade")?.value || "").trim();
      const estado = (document.getElementById("cad-estado")?.value || "").trim().toUpperCase();
      const senha = (document.getElementById("cad-senha")?.value || "").trim();
      const confirma = (document.getElementById("cad-confirma-senha")?.value || "").trim();

      if (senha !== confirma) {
        showToast("A senha e a confirmação da senha não conferem.", "error");
        return;
      }

      if (state.usuarios.some(u => (u.email || "").toLowerCase() === email)) {
        showToast("Já existe um usuário cadastrado com este e-mail.", "error");
        return;
      }

      const novoUsuario = {
        id: "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
        username: email,
        nome,
        sobrenome,
        sexo,
        data_nascimento,
        telefone,
        email,
        cep,
        rua,
        numero,
        complemento,
        bairro,
        cidade,
        estado,
        senha,
        foto: state.tempFotoCadastro || DEFAULT_AVATAR,
        role: "user",
        precisa_trocar_senha: false,
        reset_solicitado: false,
        criado_em: new Date().toISOString()
      };

      state.usuarios.push(novoUsuario);
      state.tempFotoCadastro = "";
      state.currentUser = novoUsuario;
      safeSetStorage("po_current_user", novoUsuario);

      await upsertUserSupabase(novoUsuario);
      showToast("Cadastro realizado com sucesso! Bem-vindo(a)!", "success");
      navigateTo("dashboard");
    };

    window.handleGuestPrayerSubmit = async function(ev) {
      ev.preventDefault();
      const nome = (document.getElementById("guest-nome")?.value || "").trim();
      const sobrenome = (document.getElementById("guest-sobrenome")?.value || "").trim();

      navigateTo("home");

    window.handleLoggedPrayerSubmit = async function(ev) {

      if (!texto) return;

        id: "ped_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),

        nome: u.nome,
        sobrenome: u.sobrenome,

        texto,
        criado_em: new Date().toISOString()

    };

    // =========================================================================
    // 16. PÁGINA ACOMPANHAR PEDIDOS (/acompanharpedidos) + FILTROS + WHATSAPP
    // =========================================================================
    function getFilteredPedidos() {
      const f = state.filtrosPedidos;
      const now = new Date();
      const sevenDaysAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

      return state.pedidos.filter(p => {
        const dt = new Date(p.criado_em);
        if (f.semana && dt < sevenDaysAgo) return false;
        if (f.mes && (dt.getMonth() !== now.getMonth() || dt.getFullYear() !== now.getFullYear())) return false;

        // Filtro por sexo (se apenas um estiver marcado)
        if (f.masculino && !f.feminino && p.sexo !== "Masculino") return false;
        if (f.feminino && !f.masculino && p.sexo !== "Feminino") return false;

        if (f.busca) {
          const hay = `${p.nome || ""} ${p.sobrenome || ""} ${p.texto || ""}`.toLowerCase();
          if (!hay.includes(f.busca.toLowerCase())) return false;
        }
        return true;
      });
    }

      const u = state.currentUser;

      const lista = getFilteredPedidos();

            </div>

            <!-- Filtros Combináveis -->
            <div class="flex flex-wrap items-center gap-2">
              <button type="button" onclick="toggleFiltroPedido('semana')"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                  f.semana ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                }">
                📅 Pedidos da Semana (7 dias)
              </button>
              <button type="button" onclick="toggleFiltroPedido('mes')"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                  f.mes ? 'bg-brand-600 text-white border-brand-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                }">
                🗓️ Pedidos do Mês
              </button>
              <button type="button" onclick="toggleFiltroPedido('masculino')"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                  f.masculino ? 'bg-sky-600 text-white border-sky-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                }">
                👨 Pedidos Masculinos
              </button>
              <button type="button" onclick="toggleFiltroPedido('feminino')"
                class="px-3.5 py-2 rounded-xl text-xs font-bold border transition ${
                  f.feminino ? 'bg-rose-600 text-white border-rose-600' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                }">
                👩 Pedidos Femininos
              </button>
            </div>

            ${lista.length === 0 ? `
              <div class="text-center py-12 px-4 rounded-2xl bg-slate-50 border border-dashed border-slate-200">
                <p class="text-base font-semibold text-slate-700">Nenhum pedido de oração encontrado para os filtros selecionados.</p>
                <button type="button" onclick="navigateTo('pedidooracao')"
                  class="mt-3 px-4 py-2 rounded-xl bg-brand-600 text-white text-xs font-bold">
                  + Registrar Novo Pedido
                </button>
              </div>
            ` : `
              <div class="space-y-3">
                ${lista.map(p => {
                  const canEditOrDelete = currIsAdmin || (u && p.user_id === u.id);
                  return `
                    <div class="p-5 rounded-2xl border border-slate-200 bg-slate-50/60 space-y-2.5">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                          <span class="font-bold text-sm text-slate-900">👤 ${esc(p.nome)} ${esc(p.sobrenome)}</span>
                          <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                            p.sexo === 'Feminino' ? 'bg-rose-100 text-rose-800' : 'bg-sky-100 text-sky-800'
                          }">${esc(p.sexo || 'Masculino')}</span>
                        </div>
                        <span class="text-xs text-slate-500">🕒 ${esc(formatDateTimeBR(p.criado_em))}</span>
                      </div>

                      <p class="text-sm text-slate-800 whitespace-pre-line leading-relaxed bg-white p-3.5 rounded-xl border border-slate-200/80">${esc(p.texto)}</p>

                      ${canEditOrDelete ? `
                        <div class="flex justify-end gap-2 pt-1">
                          <button type="button" onclick="openEditPedidoModal('${esc(p.id)}')"
                            class="px-3 py-1.5 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-semibold">
                            ✏️ Editar
                          </button>
                          <button type="button" onclick="handleDeletePedido('${esc(p.id)}')"
                            class="px-3 py-1.5 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-800 text-xs font-semibold">
                            🗑️ Excluir
                          </button>
                        </div>
                      ` : ""}
                    </div>
                  `;
                }).join("")}
              </div>
            `}
          </div>
        </div>
      `;
    }

    window.toggleFiltroPedido = function(chave) {
      state.filtrosPedidos[chave] = !state.filtrosPedidos[chave];
      renderApp();
    };

    window.openEditPedidoModal = function(pedidoId) {
      const p = state.pedidos.find(x => x.id === pedidoId);
      if (!p) return;
      openModal(`
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 space-y-4 fade-in">
          <div class="flex items-center justify-between">
            <h3 class="serif-title text-xl font-bold text-slate-900">✏️ Editar Pedido de Oração</h3>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
          </div>
          <form onsubmit="handleEditPedidoSubmit(event, '${esc(p.id)}')" class="space-y-4">
            <textarea id="edit-pedido-texto" rows="5" required
              class="w-full px-4 py-3 rounded-xl border border-slate-300 text-sm">${esc(p.texto)}</textarea>
            <div class="flex justify-end gap-2">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">Cancelar</button>
              <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold bg-brand-600 text-white hover:bg-brand-700">Salvar</button>
            </div>
          </form>
        </div>
      `);
    };

    window.handleEditPedidoSubmit = async function(ev, pedidoId) {
      ev.preventDefault();
      const p = state.pedidos.find(x => x.id === pedidoId);
      if (!p) return;
      p.texto = (document.getElementById("edit-pedido-texto")?.value || "").trim();
      closeModal();
      await upsertPedidoSupabase(p);
      showToast("Pedido atualizado com sucesso!", "success");
      renderApp();
    };

    window.handleDeletePedido = async function(pedidoId) {
      state.pedidos = state.pedidos.filter(x => x.id !== pedidoId);
      await deletePedidoSupabase(pedidoId);
      showToast("Pedido excluído.", "info");
      renderApp();
    };

    window.exportPedidosWhatsApp = function() {
      const lista = getFilteredPedidos();
      if (lista.length === 0) {
        showToast("Não há pedidos na lista atual para exportar.", "warning");
        return;
      }

      const linhas = [
        "🙏 *LISTA DE PEDIDOS DE ORAÇÃO* 🙏",
        `📅 _Gerado em ${formatDateTimeBR(new Date().toISOString())}_`,
        "──────────────────────"
      ];

      lista.forEach((p, idx) => {
        linhas.push(
          `\n*${idx + 1}. ${p.nome} ${p.sobrenome}* (${formatDateTimeBR(p.criado_em)})`,
          `💬 _"${p.texto}"_`
        );
      });

      linhas.push("\n──────────────────────", "✨ _\"Orai uns pelos outros, para que sareis.\" (Tiago 5:16)_");
      const textoFinal = linhas.join("\n");
      const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(textoFinal);
      window.open(url, "_blank", "noopener,noreferrer");
    };

    // =========================================================================
    // 17. PÁGINA MEU PERFIL (/perfil)
    // =========================================================================
    function renderPerfil() {
      const u = state.currentUser;
      if (!u) return renderLogin();
      const fotoPreview = state.tempFotoPerfil || u.foto || DEFAULT_AVATAR;

      return `
        <div class="fade-in max-w-2xl mx-auto">
          <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
              <div>
                <h1 class="serif-title text-2xl font-bold text-slate-900">Meu Perfil</h1>
                <p class="text-xs sm:text-sm text-slate-500">Atualize seus dados cadastrais, data de nascimento, endereço ou senha</p>
              </div>
              <button type="button" onclick="navigateTo('dashboard')" class="text-xs font-semibold text-slate-500 hover:text-slate-800">← Início</button>
            </div>

            <form onsubmit="handlePerfilSubmit(event)" class="space-y-4">
              <div class="flex items-center gap-4 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                <img id="perf-foto-preview" src="${esc(fotoPreview)}" alt="Foto"
                  class="w-16 h-16 rounded-full object-cover border-2 border-brand-500 bg-white" />
                <div class="space-y-1.5">
                  <p class="text-xs font-bold text-slate-800">Alterar Foto de Perfil</p>
                  <label class="cursor-pointer inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-600 text-white text-xs font-semibold">
                    <span>📷 Escolher Nova Foto</span>
                    <input type="file" accept="image/*" class="hidden" onchange="handlePhotoInput(this, 'perf-foto-preview', 'tempFotoPerfil')" />
                  </label>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Nome *</label>
                  <input id="perf-nome" type="text" required value="${esc(u.nome)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Sobrenome *</label>
                  <input id="perf-sobrenome" type="text" required value="${esc(u.sobrenome)}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Sexo *</label>
                  <select id="perf-sexo" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white">
                    <option value="Masculino" ${u.sexo === 'Masculino' ? 'selected' : ''}>Masculino</option>
                    <option value="Feminino" ${u.sexo === 'Feminino' ? 'selected' : ''}>Feminino</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Data de Nascimento *</label>
                  <input id="perf-nascimento" type="date" required value="${esc(u.data_nascimento || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Telefone *</label>
                  <input id="perf-telefone" type="text" required value="${esc(u.telefone || '')}" oninput="maskPhone(this)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">E-mail *</label>
                  <input id="perf-email" type="email" required value="${esc(u.email || '')}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">CEP <span id="perf-cep-status" class="text-[10px] text-brand-700"></span></label>
                  <input id="perf-cep" type="text" value="${esc(u.cep || '')}" oninput="maskCepAndLookup(this, 'perf')" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Rua</label>
                  <input id="perf-rua" type="text" value="${esc(u.rua || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Número</label>
                  <input id="perf-numero" type="text" value="${esc(u.numero || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div class="sm:col-span-2">
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Complemento</label>
                  <input id="perf-complemento" type="text" value="${esc(u.complemento || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Bairro</label>
                  <input id="perf-bairro" type="text" value="${esc(u.bairro || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Cidade</label>
                  <input id="perf-cidade" type="text" value="${esc(u.cidade || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Estado (UF)</label>
                  <input id="perf-estado" type="text" maxlength="2" value="${esc(u.estado || '')}" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm bg-white uppercase" />
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nova Senha (deixe em branco para manter a atual)</label>
                <input id="perf-nova-senha" type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm" />
              </div>

              <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm shadow-sm transition">
                Salvar Alterações do Perfil
              </button>
            </form>
          </div>
        </div>
      `;
    }

    window.handlePerfilSubmit = async function(ev) {
      ev.preventDefault();
      const u = state.currentUser;
      if (!u) return;

      u.nome = (document.getElementById("perf-nome")?.value || "").trim();
      u.sobrenome = (document.getElementById("perf-sobrenome")?.value || "").trim();
      u.sexo = document.getElementById("perf-sexo")?.value || "Masculino";
      u.data_nascimento = (document.getElementById("perf-nascimento")?.value || "").trim();
      u.telefone = (document.getElementById("perf-telefone")?.value || "").trim();
      u.email = (document.getElementById("perf-email")?.value || "").trim();
      u.cep = (document.getElementById("perf-cep")?.value || "").trim();
      u.rua = (document.getElementById("perf-rua")?.value || "").trim();
      u.numero = (document.getElementById("perf-numero")?.value || "").trim();
      u.complemento = (document.getElementById("perf-complemento")?.value || "").trim();
      u.bairro = (document.getElementById("perf-bairro")?.value || "").trim();
      u.cidade = (document.getElementById("perf-cidade")?.value || "").trim();
      u.estado = (document.getElementById("perf-estado")?.value || "").trim().toUpperCase();

      if (state.tempFotoPerfil) {
        u.foto = state.tempFotoPerfil;
        state.tempFotoPerfil = "";
      }

      const novaSenha = (document.getElementById("perf-nova-senha")?.value || "").trim();
      if (novaSenha) {
        u.senha = novaSenha;
        u.precisa_trocar_senha = false;
      }

      const idx = state.usuarios.findIndex(x => x.id === u.id);
      if (idx !== -1) state.usuarios[idx] = u;
      safeSetStorage("po_current_user", u);

      await upsertUserSupabase(u);
      showToast("Perfil atualizado com sucesso!", "success");
      navigateTo("dashboard");
    };

    // =========================================================================
    // 18. MODAL DE CONFIGURAÇÃO DO SUPABASE (EXCLUSIVO PARA ADMINISTRADORES)
    // =========================================================================
    window.openSupabaseAdminModal = function() {
      if (!isAdmin(state.currentUser)) {
        showToast("Acesso restrito aos administradores.", "error");
        return;
      }

      const sqlScript = `-- Execute no SQL Editor do Supabase para criar/atualizar as tabelas:
create table if not exists public.usuarios (
  id text primary key,
  username text,
  nome text not null,
  sobrenome text not null,
  sexo text not null,
  data_nascimento text,
  telefone text,
  email text not null,
  cep text,
  rua text,
  numero text,
  complemento text,
  bairro text,
  cidade text,
  estado text,
  senha text not null,
  foto text,
  role text default 'user',
  precisa_trocar_senha boolean default false,
  reset_solicitado boolean default false,
  criado_em timestamptz default now()
);

alter table public.usuarios add column if not exists data_nascimento text;

create table if not exists public.pedidos (
  id text primary key,
  user_id text,
  nome text not null,
  sobrenome text not null,
  sexo text,
  texto text not null,
  criado_em timestamptz default now()
);

alter table public.usuarios enable row level security;
alter table public.pedidos enable row level security;

drop policy if exists "Acesso publico usuarios" on public.usuarios;
create policy "Acesso publico usuarios" on public.usuarios for all to anon, authenticated using (true) with check (true);

drop policy if exists "Acesso publico pedidos" on public.pedidos;
create policy "Acesso publico pedidos" on public.pedidos for all to anon, authenticated using (true) with check (true);`;

      openModal(`
        <div class="bg-white rounded-3xl max-w-2xl w-full p-6 sm:p-7 shadow-2xl border border-slate-200 space-y-4 fade-in max-h-[90vh] overflow-y-auto">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div>
              <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-brand-100 text-brand-800">Exclusivo Administrador</span>
              <h3 class="serif-title text-xl font-bold text-slate-900 mt-1">⚙️ Conexão Supabase & Banco de Dados</h3>
            </div>
            <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">✕</button>
          </div>

          ${state.sbLastError ? `
            <div class="p-3.5 rounded-2xl bg-rose-50 border border-rose-200 text-xs text-rose-800">
              <strong>Último aviso de conexão:</strong> ${esc(state.sbLastError)}
            </div>
          ` : `
            <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-800">
              ✅ Credenciais do projeto conectadas e normalizadas automaticamente (sem duplicação de <code>/rest/v1</code>).
            </div>
          `}

          <div class="space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Supabase URL</label>
              <input id="sb-input-url" type="text" value="${esc(state.sbUrl)}"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Supabase Anon Key</label>
              <input id="sb-input-key" type="text" value="${esc(state.sbKey)}"
                class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-mono" />
            </div>
            <div class="flex flex-wrap gap-2">
              <button type="button" onclick="saveAndSyncSupabaseAdmin()"
                class="px-4 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold">
                🔄 Salvar e Sincronizar Agora
              </button>
              <button type="button" onclick="copySqlScript()"
                class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold">
                📋 Copiar Script SQL (Com Data de Nascimento)
              </button>
            </div>
          </div>

          <div>
            <p class="text-xs font-semibold text-slate-700 mb-1">Script SQL para o SQL Editor do Supabase:</p>
            <textarea id="sb-sql-textarea" readonly rows="8"
              class="w-full p-3 rounded-xl bg-slate-900 text-emerald-300 text-[11px] font-mono">${esc(sqlScript)}</textarea>
          </div>
        </div>
      `);
    };

    window.saveAndSyncSupabaseAdmin = async function() {
      const urlVal = (document.getElementById("sb-input-url")?.value || DEFAULT_SUPABASE_URL).trim();
      const keyVal = (document.getElementById("sb-input-key")?.value || DEFAULT_SUPABASE_KEY).trim();
      state.sbUrl = urlVal;
      state.sbKey = keyVal;
      safeSetStorage("po_sb_url", urlVal);
      safeSetStorage("po_sb_key", keyVal);
      closeModal();
      await syncFromSupabase(false);
    };

    window.copySqlScript = function() {
      const area = document.getElementById("sb-sql-textarea");
      if (!area) return;
      area.select();
      try {
        document.execCommand("copy");
        showToast("Script SQL copiado para a área de transferência!", "success");
      } catch (e) {
        showToast("Selecione o texto acima para copiar.", "info");
      }
    };

    // =========================================================================
    // 19. RENDERIZADOR PRINCIPAL (SÍNCRONO E INSTANTÂNEO)
    // =========================================================================
    function renderApp() {
      renderHeader();
      renderFooter();

      const main = document.getElementById("app-main");
      if (!main) return;

      switch (state.route) {
        case "login":
          main.innerHTML = renderLogin();
          break;
        case "cadastro":
          main.innerHTML = renderCadastro();
          break;
        case "pedidoconvidado":
          main.innerHTML = renderPedidoConvidado();
          break;
        case "dashboard":
          main.innerHTML = renderDashboard();
          break;
        case "contatos":
          main.innerHTML = renderContatos();
          break;
        case "pedidooracao":
          main.innerHTML = renderPedidoOracao();
          break;
        case "acompanharpedidos":
          main.innerHTML = renderAcompanharPedidos();
          break;
        case "aniversariantes":
          main.innerHTML = renderAniversariantes();
          break;
        case "perfil":
          main.innerHTML = renderPerfil();
          break;
        case "home":
        default:
          main.innerHTML = state.currentUser ? renderDashboard() : renderHomePublic();
          break;
      }
    }

    // Inicialização imediata (sem travar na conexão do Supabase!)
    (function initApp() {
      state.route = detectInitialRoute();
      if (PROTECTED_ROUTES.includes(state.route) && !state.currentUser) {
        state.route = "login";
      }
      renderApp();
      // Sincroniza em segundo plano sem bloquear cliques
      syncFromSupabase(true);
    })();
  </script>
</body>
</html>
